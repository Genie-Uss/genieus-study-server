spring:
  config:
    activate:
      on-profile: prod
    import: 'classpath:discord-config-prod.yml'
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: -1ms
        shutdown-timeout: 100ms
        client-name: auth-service
        client-options:
          connect-timeout: 3000ms
        read-from: REPLICA_PREFERRED
  jpa:
    hibernate:
      ddl-auto: update

logging:
  level:
    root: WARN
    shop.genieus.study: INFO
    org.hibernate.SQL: WARN
  # 파일 로깅 비활성화
  # logging.file.name이나 logging.file.path를 설정하지 않아야 로그가 stdout/stderr로 출력
  file:
    name:  # 완전히 비워둠
    path:  # 완전히 비워둠
  # 콘솔 패턴 제거 (JSON 출력을 위해)
  pattern:
    console:  # 비워두면 logback-spring.xml의 JSON 설정이 적용됨

frontend:
  url: ${GENIEUS_STUDY_SERVER_URL}

server:
  url: ${GENIEUS_STUDY_SERVER_URL}
  port: ${APP_SERVER_PORT}